name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and package skills
        run: python .github/scripts/skills.py build
      - name: Upload skill zips
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/*.zip
          retention-days: 7
